name: 'deploy'

on:
  # Legacy Dokku deployment kept only for an explicitly approved manual
  # recovery. Docker Compose and Server Ops are the canonical release path.
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type LEGACY_DOKKU_RECOVERY to use the retired recovery path
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'LEGACY_DOKKU_RECOVERY' }}
    environment: legacy-dokku-recovery
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: 'ssh://dokku@app2.fabricadesoftware.ifc.edu.br:1022/aquaapi'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          branch: main
